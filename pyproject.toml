[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketimmune"
version = "0.2.0"
description = "Predicts which Hyperliquid perp fills a market maker will regret: markout labels, leakage-safe CatBoost, a priority-fee study, and a live terminal."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Caesar (Zwc-11)" }]
dependencies = [
  "httpx>=0.27",
  "lz4>=4.4",
  "numpy>=2.2",
  "pandas>=2.2",
  "polars>=1.40",
  "pyarrow>=24.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Model training and the web-model export.
training = ["catboost>=1.2.10"]
# Requester-pays Hyperliquid S3 (node fills, L2 archive, replica_cmds).
aws = ["boto3>=1.34"]
# Django API that serves the terminal and the scored-fill decisions.
server = ["django>=5.1", "djangorestframework>=3.15", "django-cors-headers>=4.4", "python-dotenv>=1.0"]
# Always-on order-book recorder (deploy/recorder); deploy/recorder/requirements.txt mirrors this.
recorder = ["websockets>=15"]
# Price of Priority study. Versions named in its plan are pinned as written.
causal = ["rdrobust==2.1.1", "rddensity==3.0", "rdlocrand==3.0", "pyfixest==0.60.0"]
survival = ["lifelines==0.30.3"]
signal = ["lightgbm>=4.6"]
stats = ["arch>=7.2", "statsmodels>=0.14", "scipy>=1.14"]
sim = ["hftbacktest==2.4.4"]  # needs numpy<2.3
hl = ["hyperliquid-python-sdk==0.24.0"]
viz = ["matplotlib>=3.9"]
dev = [
  "boto3-stubs[s3]>=1.34",
  "coverage[toml]>=7.5",
  "maturin>=1.8",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marketimmune*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["server/api/static", "frontend", "data", "_to_delete"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"server/api/migrations/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
packages = ["marketimmune"]
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "boto3", "boto3.*", "lz4", "lz4.*", "matplotlib", "matplotlib.*", "catboost", "catboost.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = ["network: needs internet access (skipped unless MARKETIMMUNE_NETWORK_TESTS=1)"]

[tool.coverage.run]
source = ["marketimmune"]
branch = true
omit = ["marketimmune/cli/*"]  # thin entry points, like the old scripts/

[tool.coverage.report]
fail_under = 90
show_missing = true
