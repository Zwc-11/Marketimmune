# /etc/chrony/chrony.conf for the recorder VPS.
# Receive timestamps are only as good as this clock: check `chronyc tracking`
# (System time offset well under 1 ms) before trusting a day of data.
pool time.cloudflare.com iburst nts maxsources 2
pool 2.pool.ntp.org iburst maxsources 3
# Do not add time.google.com or time.aws.com: both smear leap seconds and must
# not be mixed with non-smearing sources.
makestep 1.0 3          # step only at startup; slew afterwards
rtcsync
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
log tracking measurements statistics
leapsectz right/UTC
