name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Lock is current
        run: uv lock --check
      - name: Install (training, server, aws, recorder, fast, dev)
        run: uv sync --frozen --extra training --extra server --extra aws --extra recorder --extra fast --extra dev
      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen python scripts/check_line_limit.py
      - name: Typecheck
        run: uv run --frozen python scripts/typecheck.py
      - name: Django checks
        run: |
          uv run --frozen python server/manage.py check
          uv run --frozen python server/manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: |
          uv run --frozen coverage run -m pytest
          uv run --frozen coverage report

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
